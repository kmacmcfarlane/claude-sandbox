# config.yaml — configuration for the sandbox container
#
# Place this file at .claude-sandbox/config.yaml (next to .claude-sandbox/env).
# Requires 'yq' to be installed on the host.

# Model override. Forwarded to claude as --model.
# Accepts an alias (e.g. 'opus', 'sonnet') or a full model ID (e.g. 'claude-opus-4-8').
# CLI flag --model takes precedence over this value.
# model: opus

# Container memory limit. Uses Docker memory notation (e.g. 512m, 8g, 16g).
# Swap is disabled — the container is OOM-killed if it exceeds this limit.
# Default: 8g
# memoryLimit: 8g

# Host access — control which host resources are mounted into the container.
# Each can also be enabled via CLI flags (--ssh, --git, --docker-socket, --aws)
# or environment variables (CLAUDE_SANDBOX_HOST_ACCESS_*_ENABLED=1).
# Precedence: CLI flag > env var > YAML.
hostAccess:
  # Mount ~/.ssh/ read-only (SSH keys for git remotes)
  ssh:
    enabled: true
  # Mount ~/.gitconfig read-only (git identity)
  git:
    enabled: true
  # Mount /var/run/docker.sock (host Docker daemon access)
  dockerSocket:
    enabled: false
  # Mount ~/.aws/ read-only (AWS CLI/SDK credentials)
  aws:
    enabled: false

# Extra volume mounts.
# Each mount entry has:
#   host:      absolute path on the host (required)
#   container: absolute path inside the container (required)
#   writable:  boolean, default false (mounts :ro unless true)

mounts: []
  # - host: /home/user/shared-libs
  #   container: /home/user/shared-libs
  #
  # - host: /data/datasets
  #   container: /mnt/data
  #   writable: true

# Child Dockerfile for project-specific tools.
# The launcher looks for .claude-sandbox/Dockerfile by default.
# If not found, it walks parent directories (direnv-style) so monorepos or
# workspaces can share a single child Dockerfile higher up in the tree.
# Env vars CLAUDE_SANDBOX_DOCKERFILE_DIR / CLAUDE_SANDBOX_DOCKERFILE take precedence.
#
# dockerfileDir: /path/to/dir   # directory containing the override Dockerfile
# dockerfile: Dockerfile        # filename of the override Dockerfile

# Set to true to use the base image only (no child Dockerfile).
# Suppresses the missing-Dockerfile warning and skips the parent directory search.
# Env var CLAUDE_SANDBOX_BASE_ONLY=1 overrides.
# baseOnly: false

# Disable the Claude Code version check at launch.
# Also controllable via --no-update-check flag or CLAUDE_SANDBOX_NO_UPDATE_CHECK=1.
# disableUpdateCheck: false

# How the .claude-sandbox/ directory is version-controlled.
#   false (default): foreign-safe. The launcher gitignores /.claude-sandbox/ in
#     the host repo and keeps an internal "sidecar" git repo for history. Use
#     this when working on someone else's project — nothing leaks into their
#     git history. Commit sandbox changes with:
#       git -C .claude-sandbox add -A && git -C .claude-sandbox commit -m "..."
#   true: your own project. The directory is tracked by the host repo (no
#     sidecar); .claude-sandbox/env, .claude-sandbox/temp/, and the ephemeral
#     .claude-sandbox/ralph/ runtime are gitignored, everything else committed.
# trackInHost: false
