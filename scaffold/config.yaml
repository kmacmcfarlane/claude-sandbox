# config.yaml — configuration for the sandbox container
#
# Lives at .claude-sandbox/config.yaml. No host tooling required — the
# launcher parses and merges this file natively.
#
# CASCADE: every .claude-sandbox/config.yaml from the filesystem root down to
# the project is merged at launch (the launcher prints the cascade). More-local
# values override upstream ones; `mounts` entries append, except an entry with
# the same host+container as an upstream one, which overrides it (e.g. to flip
# `writable`). This file is therefore SPARSE — everything is commented out.
# Uncomment a key only to set or override it for this project; upstream
# catch-all configs keep applying as defaults.

# Model override. Forwarded to claude as --model.
# Accepts an alias (e.g. 'opus', 'sonnet') or a full model ID (e.g. 'claude-opus-4-8').
# CLI flag --model takes precedence over this value.
# model: opus

# Container memory limit. Uses Docker memory notation (e.g. 512m, 8g, 16g).
# Swap is disabled — the container is OOM-killed if it exceeds this limit.
# The limit is PER CONTAINER, so several sessions in their own containers
# multiply it; sessions joined into one container share its limit.
# Default: 8g
# memoryLimit: 8g

# Key sequence that detaches a session without stopping it. Applies to every
# interactive session alike — one you launched, one you reattached to
# (claude-sandbox --attach), and one you joined (--join).
# Docker --detach-keys syntax: a single a-z, ctrl-<char>, or a comma-separated
# sequence.
# Docker's own default (ctrl-p,ctrl-q) is NOT used here because the Claude Code
# TUI binds ctrl+p. Safe alternatives, unbound by the TUI: ctrl-q, ctrl-^, ctrl-@.
# Default: ctrl-q,ctrl-q
# detachKeys: ctrl-q,ctrl-q

# Host access — control which host resources are mounted into the container.
# Each can also be enabled via CLI flags (--ssh, --git, --docker-socket, --aws,
# --package-caches) or environment variables (CLAUDE_SANDBOX_HOST_ACCESS_*_ENABLED=1).
# Precedence: CLI flag > env var > YAML. Default: all disabled.
# hostAccess:
#   # Mount ~/.ssh/ read-only (SSH keys for git remotes)
#   ssh:
#     enabled: true
#   # Mount ~/.gitconfig read-only (git identity)
#   git:
#     enabled: true
#   # Mount /var/run/docker.sock (host Docker daemon access)
#   dockerSocket:
#     enabled: false
#   # Mount ~/.aws/ read-only (AWS CLI/SDK credentials)
#   aws:
#     enabled: false
#   # Keep package downloads made INSIDE sessions (go modules, the go build
#   # cache, npm, pip) on the host so they survive the container. Mounts
#   # ~/.cache/claude-sandbox/{go-mod,go-build,npm,pip} writable at the same
#   # path and sets GOMODCACHE / GOCACHE / npm_config_cache / PIP_CACHE_DIR.
#   # The tree is sandbox-only on purpose — never your own ~/go, ~/.npm or
#   # ~/.cache/pip — so a session can never plant a module your host toolchain
#   # would trust. It grows without bound; delete the directory to reset it.
#   packageCaches:
#     enabled: false

# Extra volume mounts. Appended to any upstream mounts; re-declare an upstream
# host+container pair here to override it (e.g. make it writable).
# Each mount entry has:
#   host:      absolute path on the host (required)
#   container: absolute path inside the container (required)
#   writable:  boolean, default false (mounts :ro unless true)
# mounts:
#   - host: /home/user/shared-libs
#     container: /home/user/shared-libs
#   - host: /data/datasets
#     container: /mnt/data
#     writable: true

# Child Dockerfile for project-specific tools. NOT merged — the nearest
# .claude-sandbox/Dockerfile up the tree wins wholesale.
# Env vars CLAUDE_SANDBOX_DOCKERFILE_DIR / CLAUDE_SANDBOX_DOCKERFILE take precedence.
# dockerfileDir: /path/to/dir   # directory containing the override Dockerfile
# dockerfile: Dockerfile        # filename of the override Dockerfile

# Set to true to use the base image only (no child Dockerfile).
# Suppresses the missing-Dockerfile warning and skips the parent directory search.
# Env var CLAUDE_SANDBOX_BASE_ONLY=1 overrides.
# baseOnly: false

# Skip Claude Code permission prompts — passes --dangerously-skip-permissions
# to claude (and ralph). Same effect as launching with --dangerous or setting
# CLAUDE_SANDBOX_DANGEROUS=1. The cascade applies: set `dangerous: false` here
# to override an upstream config that enables it.
# dangerous: false

# Run sessions in their own Claude Code worktree (.claude/worktrees/<name> on
# branch worktree-<name>, named after the container's instance noun; ralph
# uses "ralph") instead of the shared checkout. Default: off for interactive
# sessions (a worktree has its own session history, so `--resume` there would
# not list the conversations started in the repo), on for ralph. One key
# governs both. Same effect as launching with --worktree / --no-worktree or
# setting CLAUDE_SANDBOX_WORKTREE (1/true/yes on, 0/false/no off); precedence
# is flag > env > this key > the per-kind default. The cascade applies: a
# more-local value overrides an upstream one. Outside a git repository the
# launcher stands down and launches without it.
# worktree: false

# Share Claude Code's peer registry and message sockets with every other
# opted-in sandbox on this host, regardless of CLAUDE_CONFIG_DIR. Default: off.
# Discovery (/peers, ListAgents) reads <config dir>/sessions/<pid>.json, and
# each record advertises a socket path under CLAUDE_CODE_TMPDIR — both tied to
# CLAUDE_CONFIG_DIR, so trees that export different config dirs (a work
# checkout with its own .envrc, say) cannot see or message each other. Turning
# this on uses one shared folder, ~/.cache/claude-sandbox/peers, mounted at the
# same path in every opted-in container with XDG_RUNTIME_DIR pointed at it, so
# every session's advertised socket address is valid everywhere; its sessions/
# becomes the registry. Scratchpads do not move, but XDG_RUNTIME_DIR applies to
# the whole container: other tools that use it (dbus, gpg, podman) also put
# their runtime files in that shared, host-persistent folder. If an env file
# sets XDG_RUNTIME_DIR, or the socket path would be too long, the bridge is off
# for that session, with a warning. Enable it only between trees
# you would let talk to each other — it crosses that boundary on purpose.
# The bridge REPLACES the container's registry, it does not union it: every
# session you want to see must have the key on and be RELAUNCHED. Sessions
# already running without it — and the claude you run on the host — will not
# appear, so /peers looks emptier until you restart them.
# CLAUDE_SANDBOX_SHARED_PEER_REGISTRY=1/true/yes turns it on, 0/false/no is an
# explicit off that overrides an upstream true; the cascade applies.
# sharedPeerRegistry: false

# Disable the Claude Code version check at launch.
# Also controllable via --no-update-check flag or CLAUDE_SANDBOX_NO_UPDATE_CHECK=1.
# disableUpdateCheck: false

# How the .claude-sandbox/ directory is version-controlled.
#   false (default): foreign-safe. The launcher gitignores /.claude-sandbox/ in
#     the host repo and keeps an internal "sidecar" git repo for history. Use
#     this when working on someone else's project — nothing leaks into their
#     git history. Commit sandbox changes with:
#       git -C .claude-sandbox add -A && git -C .claude-sandbox commit -m "..."
#   true: your own project. The directory is tracked by the host repo (no
#     sidecar); .claude-sandbox/env, .claude-sandbox/temp/, and the ephemeral
#     .claude-sandbox/ralph/ runtime are gitignored, everything else committed.
#   In both modes the launcher also gitignores .claude/worktrees/ (Claude Code's
#     session worktrees) unless an existing .claude/ rule already covers it.
# `claude-sandbox init` writes this explicitly unless an upstream config
# already defines it (then it's inherited).
# trackInHost: false
